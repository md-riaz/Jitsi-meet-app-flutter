name: alora_meet
description: "Alora Meet - A professional Jitsi Meet wrapper for seamless video conferencing"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  jitsi_meet_flutter_sdk: ^11.6.0
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  intl: ^0.19.0
  uuid: ^4.5.1
  share_plus: ^10.1.3
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  flutter_colorpicker: ^1.1.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
